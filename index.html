<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Qiulei · 我的个人空间</title><meta name="description" content="Qiulei 的个人网页，记录生活与灵感。"><style>
*{box-sizing:border-box}body{margin:0;background:#f5f3ec;color:#19372b;font-family:system-ui,-apple-system,"PingFang SC",sans-serif}main{max-width:1040px;margin:auto;padding:32px 24px}nav{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #ccd2c6;padding-bottom:22px}.logo{font-weight:800;letter-spacing:3px}.badge{font-size:13px;background:#e2ebd9;padding:8px 13px;border-radius:30px}.hero{padding:90px 0 65px;max-width:800px}.eyebrow{font-size:13px;letter-spacing:3px;color:#60745b}h1{font-size:clamp(46px,9vw,88px);line-height:1.15;letter-spacing:-3px;margin:25px 0}h1 span{color:#72924c}p{line-height:1.9;color:#617066;font-size:17px}button{font:inherit;border:0;background:#234633;color:white;border-radius:30px;padding:16px 25px;margin:15px 0;cursor:pointer}button:hover{background:#3e6448}section{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.card{border:1px solid #d5d9cd;border-radius:18px;padding:26px;background:#fafaf5}.num{color:#839575;font-size:13px}h2{font-size:21px;margin-top:25px}.card p{font-size:14px}footer{margin-top:65px;padding-top:24px;border-top:1px solid #ccd2c6;display:flex;justify-content:space-between;gap:12px;font-size:12px;color:#68766b}#result{min-height:32px;font-size:14px}@media(max-width:640px){section{grid-template-columns:1fr}.hero{padding:60px 0 35px}footer{flex-direction:column}}
</style></head><body><main><nav><div class="logo">QIULEI.</div><span class="badge">● Hello, world</span></nav><div class="hero"><div class="eyebrow">A LITTLE SPACE ON THE INTERNET</div><h1>你好，我是 Qiulei。<br><span>很高兴在这里遇见你。</span></h1><p>这是我的第一个个人网页。<br>留一点空间，记录生活，收藏灵感，也探索新的可能。</p><button id="hello" type="button">打个招呼 ↗</button><div id="result" role="status" aria-live="polite">点击按钮，测试网页是否正常工作。</div></div><section><article class="card"><span class="num">01 / LIFE</span><h2>生活碎片</h2><p>把平凡日子里值得记住的小事，慢慢收集起来。</p></article><article class="card"><span class="num">02 / IDEAS</span><h2>灵感笔记</h2><p>保持好奇，把一闪而过的念头变成有趣的作品。</p></article><article class="card"><span class="num">03 / EXPLORE</span><h2>持续探索</h2><p>从这个小小的网页开始，试着创造更多可能。</p></article></section><footer><span>© 2026 Qiulei · Made with curiosity</span><span id="clock"></span></footer></main><script>let count=0;document.getElementById('hello').addEventListener('click',()=>{count++;document.getElementById('result').textContent='你好，欢迎来到我的网页！🎉 按钮已成功响应 '+count+' 次。'});function tick(){document.getElementById('clock').textContent=new Date().toLocaleString('zh-CN',{hour12:false})}tick();setInterval(tick,1000);</script></body></html>
